<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>暗色站点夹具（站点自己涂黑底白字）</title>
<style>
  /* 模拟一个已经自带暗色主题的站点：它自己设 body 背景与文字色 */
  body { margin: 0; padding: 24px; background: #14141c; color: #dcdce6;
         font-family: system-ui, sans-serif; }
  .panel { background: #1f1f2b; padding: 16px; margin-block: 12px; }
  a { color: #8ecbff; }
  pre { background: #0d0d13; color: #c9f; padding: 12px; overflow: auto; }
</style>
<link rel="stylesheet" href="skin.css">
</head>
<body>
<h1>暗色站点：我们只该加一层膜，不该把它涂回粉白</h1>
<p>这一页的 <code>body</code> 背景由站点自己设成 <code>#14141c</code>。
默认（强涂关）时样式表只画 <code>html</code>，被站点自己的底色盖住；
打开 <code>--kPaint:1</code> 才会盖住它——那正是面板里"会盖掉站点自己的背景"这一档的语义。</p>
<p>链接 <a href="#">仍然可读</a>，代码块不该被换字色：</p>
<pre>const kawaii = true; // 高亮 token 属于站点</pre>
<div class="panel"><h3>面板</h3><p>阴影与圆角可以加，颜色仍归站点。</p></div>
<button>按钮</button> <input type="checkbox" checked> <input type="text" value="输入框">
</body>
</html>
